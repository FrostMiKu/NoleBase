[package]
name = "nole"
version = "0.2.0"
edition = "2021"
description = "Nole, a chat-style terminal note app"
license = "MIT"

[[bin]]
name = "nole"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
mbdown = { path = "../mbterm/crates/mbdown" }
mbtui = { path = "../mbterm/crates/mbtui" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
notify = "8"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
