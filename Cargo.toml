[package]
name = "nole"
version = "0.7.2"
edition = "2021"
description = "An Agent-driven terminal knowledge management system"
license = "MIT"
repository = "https://github.com/FrostMiKu/NoleBase"
homepage = "https://github.com/FrostMiKu/NoleBase"
readme = "README.md"
exclude = [".github/**", "AGENTS.md"]

[[bin]]
name = "nole"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
mbdown = "0.1.3"
mbtui = "0.1.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fastrand = "2"
htmd = "0.5.5"
notify = "8"
open = "5"
portable-pty = "0.9"
unicode-width = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
similar = "2"
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
eventsource-stream = "0.2"
alacritty_terminal = { version = "0.26", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
