[package]
name = "nole"
version = "0.6.2"
edition = "2021"
description = "Nole, a chat-style terminal note app"
license = "MIT"

[[bin]]
name = "nole"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
mbdown = { path = "../mbdown/crates/mbdown" }
mbtui = { path = "../mbdown/crates/mbtui" }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fastrand = "2"
htmd = "0.5.5"
notify = "8"
open = "5"
portable-pty = "0.9"
unicode-width = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
similar = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
eventsource-stream = "0.2"
vt100 = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
