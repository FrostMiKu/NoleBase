[package]
name = "nole"
version = "1.4.0"
edition = "2021"
rust-version = "1.100"
description = "An Agent-driven terminal knowledge management system"
license = "MIT"
repository = "https://github.com/FrostMiKu/NoleBase"
readme = "README.md"
exclude = [".github/**", "AGENTS.md"]

[lib]
name = "nole"
path = "src/lib.rs"

[[bin]]
name = "nole"
path = "src/bin/nole.rs"
required-features = ["tui"]

[[bin]]
name = "nole-gui"
path = "src/bin/nole-gui.rs"
required-features = ["gui"]

[features]
default = ["tui"]
gui = [
    "dep:gpui-kit",
    "dep:data-url",
    "dep:mermaid-rs-renderer",
    "dep:ratex-parser",
    "dep:ratex-layout",
    "dep:ratex-types",
    "dep:ratex-svg",
]
gui-test = ["gui", "gpui-kit/test-support"]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:mermaid-text",
    "dep:txm",
    "dep:strip-ansi-escapes",
    "dep:syntect",
    "dep:clipboard-rs",
    "dep:ratatui-image",
    "dep:open",
]

[dependencies]
mermaid-rs-renderer = { version = "0.3.1", default-features = false, optional = true }
ratex-parser = { version = "0.1.15", optional = true }
ratex-layout = { version = "0.1.15", optional = true }
ratex-types = { version = "0.1.15", optional = true }
ratex-svg = { version = "0.1.15", features = ["embed-fonts"], optional = true }
data-url = { version = "0.3.2", optional = true }
gpui-kit = { version = "0.9.1", optional = true, features = ["tree-sitter-rust", "tree-sitter-markdown"] }
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29", optional = true }
pulldown-cmark = { version = "0.13.6", default-features = false }
mermaid-text = { version = "0.58.0", optional = true }
txm = { version = "0.1.6", optional = true }
strip-ansi-escapes = { version = "0.2.1", optional = true }
syntect = { optional = true, version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
clipboard-rs = { optional = true, version = "0.3.5", features = ["image"] }
base64 = "0.23"
brush-builtins = "0.2.0"
brush-core = "0.5.0"
brush-interactive = { version = "0.4.0", features = ["basic"] }
brush-parser = "0.4.0"
ratatui-image = { optional = true, version = "11.1", default-features = false, features = ["crossterm"] }
anyhow = "1"
anydoc = "0.2.4"
async-trait = "0.1"
cap-std = "4.0.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
fastrand = "2"
globset = "0.4"
ignore = "0.4"
fasteval = "0.2.4"
jsonschema = { version = "0.61.2", default-features = false }
htmd = "0.5.6"
notify = "8.2.2"
open = { version = "5", optional = true }
portable-pty = "0.9"
unicode-width = "0.2.3"
zeroize = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
sha2 = "0.11"
similar = { version = "3", features = ["unicode"] }
toml = "1"
toml_edit = "0.25"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
eventsource-stream = "0.2"
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"

[profile.release]
opt-level = "z"
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Keep native layout and rendering responsive in desktop debug builds.
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.gpui-base]
opt-level = 2

[profile.dev.package.gpui-kit]
opt-level = 2

[[test]]
name = "gui_rendering"
path = "tests/gui_rendering.rs"
harness = false
required-features = ["gui-test"]
