[package]
name = "nole"
version = "0.9.1"
edition = "2021"
rust-version = "1.88"
description = "An Agent-driven terminal knowledge management system"
license = "MIT"
repository = "https://github.com/FrostMiKu/NoleBase"
homepage = "https://github.com/FrostMiKu/NoleBase"
readme = "README.md"
exclude = [".github/**", "AGENTS.md"]

[[bin]]
name = "nole"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
mbdown = "0.1.4"
mbtui = "0.1.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
clipboard-rs = { version = "0.3.5", features = ["image"] }
base64 = "0.22"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
anyhow = "1"
anydoc = "0.1.8"
async-trait = "0.1"
cap-std = "4.0.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fastrand = "2"
globset = "0.4"
ignore = "0.4"
meval = "0.2"
jsonschema = { version = "0.49", default-features = false }
htmd = "0.5.5"
notify = "8"
open = "5"
portable-pty = "0.9"
unicode-width = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
sha2 = "0.10"
similar = "2"
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
eventsource-stream = "0.2"
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"

[profile.release]
opt-level = "z"
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
