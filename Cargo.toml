[package]
name = "nole"
version = "0.4.0"
edition = "2021"
description = "Nole, a chat-style terminal note app"
license = "MIT"

[[bin]]
name = "nole"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
mbdown = { path = "../mbterm/crates/mbdown" }
mbtui = { path = "../mbterm/crates/mbtui" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
notify = "8"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
toml = "0.8"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
