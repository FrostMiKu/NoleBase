[package]
name = "nole"
version = "0.6.0"
edition = "2021"
description = "Nole, a chat-style terminal note app"
license = "MIT"

[[bin]]
name = "nole"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
mbdown = { path = "../mbdown/crates/mbdown" }
mbtui = { path = "../mbdown/crates/mbtui" }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fastrand = "2"
notify = "8"
open = "5"
unicode-width = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
