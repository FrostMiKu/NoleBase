name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            test: true
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            test: true
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            test: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The frontend build also flips the build script's cfg(embed_web_ui),
      # so cargo test exercises the embedded-UI serving on every platform.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - name: Run web UI tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm --dir web test

      - name: Run tests
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}
