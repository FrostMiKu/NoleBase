name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            builder: cargo
            test: true
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: cargo
            test: true
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
            test: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: ${{ matrix.builder }} build --locked --release --target ${{ matrix.target }}
